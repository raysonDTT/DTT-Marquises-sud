<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Direction des Transports Terrestres - Circonscription des Îles Marquises
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <img src="logo.png" alt="Logo Circonscription des Îles Marquises" class="logo">

    <h1>
        Circonscription des Îles Marquises
    </h1>

    <h2>
        Direction des Transports Terrestres
    </h2>

</header>



<main>


<section class="bienvenue">

    <h2>
        Bienvenue sur le portail des démarches
    </h2>

    <p>
        Retrouvez facilement les pièces justificatives nécessaires
        pour vos demandes auprès de la Direction des Transports Terrestres
        de la Circonscription des Îles Marquises.
    </p>

</section>



<div id="cards" class="cards">

    <!-- Les cartes seront créées automatiquement -->

</div>


</main>





<!-- Fenêtre Consulter -->


<div id="modal" class="modal">


    <div class="modal-content">


        <span id="close">&times;</span>


        <h2 id="titreDemarche"></h2>


        <ul id="listePieces"></ul>


    </div>


</div>




<script src="data.js"></script>

<script src="script.js"></script>


</body>

</html>
